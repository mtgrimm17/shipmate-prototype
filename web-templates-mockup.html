  select(ed ? ed.dataset.edit : null);
});

/* WHAT CAN BE MOVED, AND WHAT CANNOT.

   The title and the call to action are placed by the layout — flush to the
   content's left and right margins, centred on each other — and that is the
   whole reason Text split looks composed rather than assembled. Dragging
   either of them can only break that alignment, and there is no way to get it
   back by hand. The logotype and the tagline stay free, which is where free
   placement was actually wanted: floating over the artwork.

   The `fixed` class is on the element, so the cursor tells you before you try. */
const FIXED = { title:1, buy:1 };

function startDrag(e, el){
  const key  = el.dataset.edit;
  // Not draggable still means selectable: the press picks it, it just does not
  // carry it anywhere.
  if(FIXED[key]){ select(key); return; }
  // The stage, not the hero: positions are percentages of the CONTENT COLUMN,
  // so that a logo on the left third lines up with the column below it rather
  // than with a third of the full-bleed artwork.
  const hero = el.closest('.hero-stage');
  const st   = { title:M.title, logo:M.logo, hook:M.hook, buy:M.buy }[key];
  const lb   = el.getBoundingClientRect();
  const offX = e.clientX - (lb.left + lb.width/2);
  const x0 = e.clientX, y0 = e.clientY;
  let moved = false;

  // Dragging is FREE — this element, anywhere, both axes, nothing else moves.
  // There is nothing to reconcile afterwards: the position the pointer leaves
  // it at IS the stored state.
  const offY = e.clientY - lb.top;      // grabbed relative to its TOP edge
  const items = heroItems();

  el.setPointerCapture(e.pointerId);
  const guides = site.querySelector('.guides');
  const av = site.querySelector('.aguides .av');
  const ah = site.querySelector('.aguides .ah');
  // The nearest other element to line up with horizontally. Measured once at
  // press: neither changes size during a drag.
  const otherKey = items.map(it => it.key).find(k => k !== key);
  const other = otherKey ? site.querySelector(`[data-edit="${otherKey}"]`) : null;
  const A = alignTargets(hero, el, other);

  const move = ev => {
    if(!moved && Math.hypot(ev.clientX-x0, ev.clientY-y0) < 3) return;
    if(!moved){
      moved = true;
      M.layout = null;                  // hand-placed now, so no preset is current
      site.classList.add('dragging'); el.classList.add('drag'); closePanels();
      renderBar();
    }
    const b = hero.getBoundingClientRect();
    // Horizontal is computed in CENTRE space — that is what the snapping and
    // the alignment guides speak, and it is how the eye lines things up — then
    // converted to whichever edge this element is anchored by. Clamped to its
    // own half-width, so it can be dragged flush against either margin and no
    // further; the old fixed 4–96% both let things hang outside the column and
    // stopped them ever reaching the edge a layout puts them on.
    const wPct = (lb.width / b.width) * 100;
    const rawCx = ((ev.clientX - offX - b.left) / b.width) * 100;
    const sx = resolveSnap(Math.max(wPct/2, Math.min(100 - wPct/2, rawCx)), A.x);
    const anchorFrac = ANCHOR[st.align || 'center'];
    const xForAnchor = sx.v + (anchorFrac - 0.5) * wPct;

    // Vertically the element is anchored by its top edge, but snapping has to
    // judge its CENTRE — the eye lines a thing up by its middle, not its top —
    // so the centre is what gets snapped and the top is derived back from it.
    const hPct = (lb.height / b.height) * 100;
    const rawTop = ((ev.clientY - offY - b.top) / b.height) * 100;
    const sy = resolveSnap(rawTop + hPct/2, A.y);
    const top = Math.max(0, Math.min(100 - hPct, sy.v - hPct/2));

    st.x = xForAnchor; st.top = top;
    el.style.left = xForAnchor+'%'; el.style.top = top+'%';

    if(av){ av.classList.toggle('on', sx.line !== null); if(sx.line !== null) av.style.left = sx.line+'%'; }
    if(ah){ ah.classList.toggle('on', sy.line !== null); if(sy.line !== null) ah.style.top  = sy.line+'%'; }

    // Frame grid: lit only when the element is exactly on a third or the
    // centre AND is not already held by an alignment, so the two kinds of
    // guide never claim the same moment.
    guides.querySelectorAll('.gv').forEach(n => n.classList.toggle('hit', sx.line === null && +n.dataset.p === sx.v));
    guides.querySelectorAll('.gh').forEach(n => n.classList.toggle('hit', sy.line === null && +n.dataset.p === sy.v));
  };
  const up = () => {
    el.removeEventListener('pointermove', move);
    el.removeEventListener('pointerup', up);
    site.classList.remove('dragging');
    el.classList.remove('drag');
    guides.querySelectorAll('.hit').forEach(n => n.classList.remove('hit'));
    if(av) av.classList.remove('on');
    if(ah) ah.classList.remove('on');
    select(key);                       // selecting after a move re-anchors the toolbar
  };
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerup', up);
}

/* Belt and braces against the native image drag: even with draggable="false"
   and -webkit-user-drag, a stray dragstart on a nested node would still hand
   the gesture to the browser. */
/* ============================================================================
   BRINGING YOUR OWN FILES

   Two ways in, because they suit different moments: the toolbar button when
   you are already editing that element, and dropping the file straight onto
   the hero when you are not. Both end in the same place.

   Read as a data: URL rather than an object URL — the page re-renders
   constantly, and every render would need the blob to still be alive, so one
   revoked URL somewhere would blank the art. A data URL survives anything.
   ========================================================================== */
const filePick = document.getElementById('filePick');
let _pickTarget = null;
function askForImage(target){ _pickTarget = target; filePick.value = ''; filePick.click(); }
filePick.addEventListener('change', () => {
  const f = filePick.files && filePick.files[0];
  if(f) useImage(_pickTarget, f);
});
function useImage(target, file){
  if(!/^image\//.test(file.type)) return hint('That is not an image');
  const fr = new FileReader();
  fr.onload = () => {
    if(target === 'art'){
      M.up.art = fr.result; M.up.artRatio = null;
      // A new picture is a new frame: keeping the old pan would carry a crop
      // that was measured against a completely different image.
      M.art.ox = M.art.oy = 0; M.art.zoom = 100;
      render(); select('art');
      hint('Your key art — drag it to reframe, or go back to the store\'s from the toolbar');
    }else{
      M.up.logo = fr.result;
      // Uploading a logotype is asking to see it.
      M.logo.show = true;
      render(); select('logo');
      hint('Your logotype — measured from its own letters, like any other');
    }
  };
  fr.onerror = () => hint('Could not read that file');
  fr.readAsDataURL(file);
}

/* Dropping onto the hero replaces the key art; onto the logotype, the
   logotype. The whole hero is a target, so there is nothing to aim at. */
site.addEventListener('dragover', e => {
  if(document.body.classList.contains('preview')) return;
  const zone = e.target.closest('#site .logo-el, #site [data-edit="art"]');
  if(!zone) return;
  e.preventDefault();
  zone.classList.add('drop-on');
});
site.addEventListener('dragleave', e => {
  const zone = e.target.closest('#site .logo-el, #site [data-edit="art"]');
  if(zone) zone.classList.remove('drop-on');
});
site.addEventListener('drop', e => {
  if(document.body.classList.contains('preview')) return;
  const zone = e.target.closest('#site .logo-el, #site [data-edit="art"]');
  if(!zone) return;
  e.preventDefault();
  zone.classList.remove('drop-on');
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) useImage(zone.classList.contains('logo-el') ? 'logo' : 'art', f);
});

site.addEventListener('dragstart', e => e.preventDefault());

/* Double-click the button to edit its label — single click selects and drags,
   so text editing needs its own gesture. */
site.addEventListener('dblclick', e => {
  if(document.body.classList.contains('preview')) return;
  const t = e.target.closest('[data-buytext],[data-hooktext],[data-titletext]');
  if(t) editText(t);
});

/* Section hide chips */
site.addEventListener('click', e => {
  const h = e.target.closest('[data-hide]');
  if(h){ e.stopPropagation(); M.show[h.dataset.hide] = false; select(null); render(); }
});

/* Links on the page are real links, and in preview they behave like it. In the
   editor they never navigate: clicking a contact chip there means "select this
   row and let me type", and following a mailto: out of a page you are still
   composing is never what you meant. */
site.addEventListener('click', e => {
  const a = e.target.closest('#site a[href]');
  if(a && !document.body.classList.contains('preview')) e.preventDefault();
});

/* ============================================================================
   SCREENSHOT VIEWER
   A page feature, not an editor one, so it works in preview as well — that is
   the only state in which a visitor would ever use it.
   ========================================================================== */
const lb = document.getElementById('lightbox');
site.addEventListener('click', e => {
  const img = e.target.closest('#site .shots img');
  if(!img) return;
  lb.querySelector('img').src = img.currentSrc || img.src;
  lb.hidden = false;
  lb.classList.add('open');
  requestAnimationFrame(() => lb.classList.add('on'));   // transition needs a frame
});
function closeLightbox(){
  if(!lb.classList.contains('open')) return true;        // nothing open: let Esc fall through
  lb.classList.remove('on');
  setTimeout(() => {
    // Both, and in this order: the class is what actually hides it, the
    // attribute keeps the DOM honest for anything reading it.
    lb.classList.remove('open');
    lb.hidden = true;
    lb.querySelector('img').removeAttribute('src');
  }, 170);
  return false;
}
lb.addEventListener('click', closeLightbox);


/* ============================================================================
   AI SUMMARISE — typed out, the way the app's own streaming inference reads
   ========================================================================== */
async function summarise(){
  const btn = document.querySelector('#tb [data-a=ai], #dock [data-a=ai]');
  if(btn){ btn.disabled = true; btn.textContent = '✦ Reading the long description…'; }
  await new Promise(r => setTimeout(r, 800));
  const list = G().minis;
  aiIdx = (aiIdx + 1) % list.length;
  const el = site.querySelector('[data-field=mini]');
  M.mini = '';
  if(el) el.textContent = '';
  for(const ch of list[aiIdx]){
    M.mini += ch;
    if(el) el.textContent = M.mini;
    await new Promise(r => setTimeout(r, 14));
  }
  if(btn){ btn.disabled = false; btn.textContent = '✦ Summarise from the long one'; }
}


/* ============================================================================
   THE BOTTOM PILL — page-wide choices only
   ========================================================================== */
/* The view switch, in the window's top-right corner. Its own node, refilled in
   place, because it has to survive preview — where the pill it used to live in
   is gone. */
const viewBtn = document.getElementById('view');
function renderView(){
  const preview = document.body.classList.contains('preview');
  viewBtn.textContent = preview ? '✎ Edit' : '👁 Preview';
  viewBtn.title = preview ? 'Back to editing (Esc)' : 'See it as a visitor does';
}
viewBtn.addEventListener('click', () => setPreview(!document.body.classList.contains('preview')));

function renderBar(){
  const hidden = Object.keys(M.show).filter(k => !M.show[k]);

  bar.innerHTML = `
    <div class="seg hide-in-preview">
      ${Object.entries(GAMES).map(([id,g]) =>
        `<button class="btn ${id===M.game?'on':''}" data-b="game" data-v="${id}">${g.label || g.name}</button>`).join('')}
    </div>
    <div class="sep hide-in-preview"></div>
    ${TEMPLATES.map(t => `<button class="thumb ${t.id===M.template?'on':''}" data-b="tpl" data-v="${t.id}" title="${t.name}"></button>`).join('')}
    <div class="sep hide-in-preview"></div>
    <div class="seg hide-in-preview">
      ${FRAMES.map(f => `<button class="btn ${f.w===M.frameW?'on':''}" data-b="frame" data-v="${f.w}" title="${f.w}px">${f.name}</button>`).join('')}
    </div>
    ${(() => {
      /* SECTIONS ONLY. The hero's pieces used to be listed here too, which
         meant "what is on my page" had two homes and neither was complete:
         a tagline came back from down here, a metadata field from nowhere at
         all. Each container now owns what is inside it — the hero owns its
         pieces, the metadata band owns its fields — and the pill owns the one
         thing that has no container but the page. */
      if(!hidden.length) return '';
      return `<div class="sep hide-in-preview"></div>
        <span class="lbl hide-in-preview">Sections</span>
        ${hidden.map(k => `<button class="btn hide-in-preview" data-b="show" data-v="${k}">${SECTION_NAMES[k]}</button>`).join('')}`;
    })()}`;
  renderView();

  // Thumbnails: the real key art for a title that has one, the generated scene
  // otherwise, so the picker previews the actual page.
  const g = G();
  bar.querySelectorAll('.thumb').forEach(el =>
    el.innerHTML = g.real ? `<img src="${g.header}" alt="">` : svgArt(el.dataset.v, artSeed));
}

bar.addEventListener('click', e => {
  const b = e.target.closest('[data-b]'); if(!b) return;
  const a = b.dataset.b, v = b.dataset.v;
  // Applying the layout, not just rendering: the arrangement decides which
  // elements are on as well as where they sit, so a bare render left the
  // state claiming `textsplit` while the page showed the old set.
  if(a === 'game')    { loadGame(v); select(null); applyLayout(M.layout || 'textsplit', true); upgradeSteamArt(v); }
  // render() re-measures the arrangement for us — a skin swap is a typeface
  // swap, which is exactly the case that was drifting.
  if(a === 'tpl')     { M.template = v; render(); }
  /* A width change re-runs the arrangement. The title and the button are
     measured against the stage — how much room the title gets, whether it
     wraps, where the button's centre lands — so a page that keeps the numbers
     it computed at 1440 would show them misaligned at 800. This is the "at
     every width" half of the promise; the placement itself is the other. */
  if(a === 'frame')   { M.frameW = +v; select(null); render(); }
  if(a === 'show')    { M.show[v] = true; render(); }
  if(a === 'showbuy')   { M.buy.mode = 'button'; render(); }
  if(a === 'showhook')  { M.hook.show = true; if(!M.hook.text) M.hook.text = G().line; render(); }
  if(a === 'showheader'){ M.header.show = true; render(); }
  if(a === 'showlogo')  { M.logo.show = true; render(); }
  if(a === 'uploadlogo'){ askForImage('logo'); }
  if(a === 'showtitle') { M.title.show = true; if(!M.title.text) M.title.text = G().name; render(); }
});
/* The scrim used to be a slider here. It is a constant now — see SCRIM. */

function setPreview(on){
  document.body.classList.toggle('preview', on);
  select(null);
  render();
  if(on) hint('Preview — Esc to keep editing');
}


/* ============================================================================
   GLOBAL
   ========================================================================== */
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  // Innermost thing first: the viewer, then preview, then the selection.
  if(!closeLightbox()) return;
  if(document.body.classList.contains('preview')) setPreview(false);
  else select(null);
});
// The toolbar is fixed, so it has to be re-anchored whenever its element moves.
// Only the FLOATING panel needs re-anchoring; the docked one is attached to
// the frame and does not move with the page.
/* Re-run the current arrangement, if one is current. A hand-placed hero has
   M.layout === null and is left exactly where the developer put it.

   Called from render()'s measuring frame, so it runs SYNCHRONOUSLY there —
   another rAF would put the placement one frame behind the paint, which is a
   visible jump. The window-resize path has no render to ride on, so it asks
   for its own frame. */
function replaceLayout(sync){
  const L = M.layout && HERO_LAYOUTS[M.layout];
  if(!L) return;
  if(sync !== false) return void placeNow(L);
  requestAnimationFrame(() => { if(M.layout) placeNow(L); });
}

/* THE WEBFONT ARRIVES LATE, and it is wider than the fallback it replaced.

   Every measurement taken before it lands is taken on a different typeface: a
   title that fitted on one line in the fallback needs two in Inter, and the
   cap the layout handed it was computed from the wrong widths. applyLayout
   already re-ran itself on fonts.ready, but the placement that runs on every
   render did not — so any redraw after the initial one was measured correctly
   and any redraw before it was not, with no way to tell which you were seeing.

   One listener, once per page: when the fonts are in, place it all again. */
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(() => replaceLayout(false));
}

const reanchor = () => {
  if(!sel || isContainer()) return;
  const node = site.querySelector(`[data-edit="${sel.key}"]`);
  if(node) placeToolbar(node);
};
scroller.addEventListener('scroll', reanchor);
window.addEventListener('resize', () => { reanchor(); replaceLayout(false); });

loadGame('spilled');
render();
// The opening arrangement goes through the same path as any other, so it gets
// the same second pass once the webfonts land.
applyLayout(M.layout, true);
/* One sentence, and it has to teach the whole rule: click a thing to change
   how it looks, click the space around it to change what is there. */
hint('Click anything to edit it, drag anything in the header — and click the artwork itself to choose what the header contains.');
</script>
</body>
</html>
