<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shipmate — Web / Pages template mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   SHIPMATE — WEB / PAGES TEMPLATE MOCKUP  (standalone, not wired to the app)

   DIRECT MANIPULATION. There is no editor panel. You click a thing on the page
   and a small toolbar appears attached to that thing, holding only its own
   controls. Text is edited where it sits. The logo and the buy button are
   dragged where you want them. The only persistent chrome is one pill at the
   bottom for the genuinely page-wide choices (template, accent, scrim), which
   have no single element to hang off.

   Why it matters here: a developer setting up a store page is making dozens of
   tiny visual judgements — is the logo clear of the boat, is the button
   readable against the water. Every one of those is a look-adjust-look loop,
   and a side panel puts the control as far as possible from the thing it
   changes. Editing in place collapses the loop.

   ONE PAGE SKELETON, THREE SKINS. Section order is Jaco's layout, and every
   template follows it — switching template changes how the page LOOKS, never
   what it says or in what order:

     1  hero      key art + a draggable logotype + a SEPARATELY draggable CTA
     2  strip      developer · publisher · release date · available on · genres
     3  lead       the mini description, summarised by AI from the long one
     4  video      trailer, or an empty drop slot
     5  shots      screenshots
     6  press      pull-quotes
     7  facts      full presskit factsheet (off by default — the strip covers
                   the headline facts)

   INTERACTION MODEL
   Lifted wholesale from the Assets step's screenshot crop tool (shotPanStart /
   _onShotPanMove / _onShotPanEnd, app.js ~7556) rather than invented here:
   grab-and-drag with the offset remembered at press, the transform written
   straight to the node, no re-render mid-gesture, and a thirds grid as the
   reference you frame against. Scale is a slider in the element's control row,
   the way that tool puts its aspect buttons in .shot-edit-controls.

     click            select an element, show its control row
     drag             move the logotype, the buy button, or the key art. Two
                      kinds of guide, deliberately different colours: white for
                      the frame's own thirds and centre, magenta the moment the
                      dragged element lines up with the other one's centre or
                      an edge
     scale slider     resize the selected element
     double-click     edit the buy button's label in place
     click text       edit the mini description or any strip value in place
     hover a section  a chip appears to hide it; hidden ones return from the
                      bottom pill
     Esc              deselect, then leave preview

   TWO GAMES are wired in: Spilled! with Jaco's real delivery assets and live
   Steam facts for appid 2240080, and a fictional Nightfall whose key art is
   generated as SVG, so the layouts can be judged with a title that has no
   assets yet.
   ========================================================================== */

:root{
  --bg:#0a0a0a; --panel:#141414; --panel-2:#1c1c1c; --panel-3:#242424;
  --border:#2a2a2a; --border-hover:#3a3a3a;
  --text:#f5f5f5; --text-dim:#a0a0a0; --text-faint:#666;
  --purple:#9F68F0; --green:#4ade80; --sel:#52BAFF;
  /* Height of the browser chrome, which overlays the page rather than sitting
     above it, so the site's own corner logotype can clear it. It used to
     collapse to 0 in preview, back when preview removed the chrome; the chrome
     stays now, so the clearance does too — otherwise the corner logotype would
     slide up under the URL the moment you previewed. */
  --chrome-h:54px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:#070707; color:var(--text); overflow:hidden;
  font-family:Inter,system-ui,-apple-system,sans-serif; font-size:14px;
  -webkit-font-smoothing:antialiased;
}

/* ── Stage ────────────────────────────────────────────────────────────────── */
.stage{display:flex;flex-direction:column;height:100vh}

/* The browser chrome belongs TO the slab: dots and URL sit in the pill's own
   top edge, so the whole thing reads as one object Shipmate is holding rather
   than the mockup pretending to be your browser.

   It is NOT sticky, and that is the fix for the page riding over it. Sticky put
   the chrome inside the scrolling document and then asked z-index and clipping
   to keep the page off it — a fight that has to be won at every corner, every
   stacking context and every containment boundary, and that this file kept
   losing in a new way each time. A real browser does not work that way: its
   chrome is not in the document at all, and the page scrolls INSIDE it. So the
   frame is modelled the same way — bar and scroller are siblings, the page
   scrolls in .frame-scroll, and content cannot reach the bar because it is in
   a different box that ends where the bar begins. No z-index needed anywhere. */
/* Frosted, and OVER the page rather than above it: the key art runs to the very
   top of the slab and is seen through the chrome, blurred. That only works as
   an overlay — a bar sitting in the flow has nothing behind it, and
   backdrop-filter with nothing to filter renders as a flat panel.
   It stays outside .frame-scroll, so the page still scrolls underneath it and
   none of the old z-order fight comes back. */
.frame-bar{
  position:absolute;top:0;left:0;right:0;z-index:40;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  padding:13px 16px;
  /* Close to the flat #2B2B2E it used to be, just not solid — enough dark grey
     to keep the dots and the URL legible over any artwork, with the picture
     still reading through it. A thinner tint than this and the chrome starts
     taking its colour from whatever the game's key art happens to be. */
  background:rgba(38,38,42,.82);
  -webkit-backdrop-filter:blur(26px) saturate(1.3);
          backdrop-filter:blur(26px) saturate(1.3);
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.10);
}
.frame-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.url{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-width:min(340px,46vw);padding:7px 16px;border-radius:999px;
  background:#161618;font-size:12px;color:#8A8F98;letter-spacing:.01em;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
}
.url b{color:#E8EAEE;font-weight:500}
.lock{width:11px;height:11px;flex:0 0 auto;color:var(--green)}
.frame-right{justify-self:end;display:flex;align-items:center}
.dots{display:flex;gap:8px}
.dots i{width:12px;height:12px;border-radius:50%;display:block}
.dots i:nth-child(1){background:#FF5F57}
.dots i:nth-child(2){background:#FEBC2E}
.dots i:nth-child(3){background:#28C840}
/* THE SHIPMATE FRAME.
   The generated page is shown inset in a rounded slab on Shipmate's own dark
   ground, rather than bleeding to the window edges — because that is what it
   actually is inside the product: a panel in the Web step, not a browser tab.
   Framing it this way makes two things legible at a glance. First, that the
   page has its own edges and will be scaled down to sit inside Shipmate's
   chrome. Second, that the layout is fluid: the slab is narrower than the
   window, so every clamp() and auto-fit grid in the skins is already being
   exercised at a smaller measure instead of only ever at full width.
   Preview drops the inset and goes edge to edge, which is the real site. */
/* The viewport no longer scrolls — .frame-scroll does. It is just the dark
   ground the slab sits on. */
.viewport{
  flex:1;min-height:0;overflow:hidden;position:relative;
  display:flex;flex-direction:column;align-items:center;
  padding:var(--frame-pad,20px);
  background:
    radial-gradient(120% 90% at 50% -10%,rgba(82,186,255,.07),transparent 60%),
    #08080a;
}
/* A window: fixed chrome on top, a scrolling page below it, the whole thing
   clipped to the rounded corners. Because the scroller is a child rather than
   the frame itself, overflow:hidden here is now harmless. */
.frame{
  position:relative;width:100%;max-width:var(--frame-w,1440px);
  flex:1;min-height:0;display:flex;flex-direction:column;
  border-radius:var(--frame-r,16px);overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,.6);
}
/* The slab's edge, drawn INSIDE it. An inset box-shadow on .frame itself would
   be painted under its own children, so the chrome and the page would cover it;
   an overlay on top is the only way to get a hairline that survives whatever
   the page paints underneath, and it inherits the radius so it follows the
   corners exactly. */
.frame::after{
  content:'';position:absolute;inset:0;z-index:50;pointer-events:none;
  border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
}
body.preview .frame::after{display:none}
/* Caption under the slab, so the framing reads as intentional rather than as a
   window that failed to fill. */
.frame-note{
  flex:0 0 auto;padding-top:12px;text-align:center;
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0;
  text-transform:uppercase;color:#4c525c;
}
body.preview .viewport{padding:0;background:none}
body.preview .frame{max-width:none;border-radius:0;box-shadow:none}
/* The browser chrome STAYS in preview. It is the nicest thing on the screen —
   dots, URL and frosted glass over the key art — and it is also what makes the
   preview read as a real site rather than as the editor with its furniture
   taken away. Only the slab's inset and its caption drop, so the page goes edge
   to edge. And the chrome is where the way back out lives, which means preview
   can never become a dead end. */
body.preview .frame-note{display:none}

/* ── Floating chrome: shared button language ──────────────────────────────── */
.btn{
  padding:6px 11px;border-radius:7px;cursor:pointer;font:inherit;font-size:11.5px;font-weight:600;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);color:#E8EAEE;transition:.14s;
  white-space:nowrap;
}
.btn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.24)}
.btn.on{background:rgba(82,186,255,.22);border-color:rgba(82,186,255,.55);color:#CDEBFF}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.ai{color:#DCC9FF;background:rgba(159,104,240,.2);border-color:rgba(159,104,240,.45)}
/* Done is the only button in a panel that ends the job rather than changing
   something, so it is the only one that is green. */
.btn.done{color:#BFF0CE;background:rgba(74,222,128,.16);border-color:rgba(74,222,128,.4)}
.btn.done:hover{background:rgba(74,222,128,.28);border-color:rgba(74,222,128,.6)}
.btn.ai:hover{background:rgba(159,104,240,.32)}
.seg{display:flex;gap:2px;padding:2px;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1)}
.seg .btn{border:0;background:transparent;padding:5px 9px}
.seg .btn:hover{background:rgba(255,255,255,.1)}
.seg .btn.on{background:rgba(82,186,255,.24)}
.sw{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;padding:0;transition:.14s}
.sw:hover{transform:scale(1.14)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px currentColor}
.sep{width:1px;height:20px;background:rgba(255,255,255,.14);flex:0 0 auto}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--text-faint);white-space:nowrap}
.glass{background:rgba(16,16,19,.9);border:1px solid rgba(255,255,255,.13);
  box-shadow:0 14px 44px rgba(0,0,0,.6);backdrop-filter:blur(16px) saturate(1.3)}

/* ── The contextual toolbar — one node, contents swapped per selection ────── */
#tb{
  position:fixed; z-index:70; display:none; align-items:center; gap:8px;
  padding:7px 9px; border-radius:11px;
}
#tb.show{display:flex}
#tb::after{  /* little pointer at the anchored edge */
  content:'';position:absolute;left:var(--tbx,50%);width:9px;height:9px;
  background:inherit;border:inherit;transform:translateX(-50%) rotate(45deg);
}
#tb[data-side=top]::after{bottom:-5px;border-top:0;border-left:0}
#tb[data-side=bottom]::after{top:-5px;border-bottom:0;border-right:0}
/* ── The docked container panel ───────────────────────────────────────────── */
/* Sits inside the slab, under the chrome, and belongs to the frame rather than
   to the window — so it lines up with the page it is editing at every frame
   width, and preview never sees it. */
/* AN ISLAND, not a bar. Glued edge to edge under the chrome it read as part of
   the browser — a second row of window furniture — which is the one thing it
   is not: it belongs to the page, and only while you are editing it.

   So it floats: as wide as its own contents, centred, with the frame's own
   corner radius and shadow. Same language as the pill at the bottom, and
   nothing about it can be mistaken for the site's own header.

   Still pinned to the top and still outside the scroller — it does not travel
   with the page — because it is about an area, and the area is up here. */
#dock{
  position:absolute;left:50%;top:calc(var(--chrome-h,0px) + 12px);z-index:39;
  width:max-content;max-width:calc(100% - 28px);
  display:none;align-items:center;gap:8px 9px;padding:9px 12px;flex-wrap:wrap;
  border-radius:13px;
  transform:translate(-50%,-10px);opacity:0;transition:transform .16s,opacity .16s;
}
#dock.show{display:flex;transform:translate(-50%,0);opacity:1}
/* WRAPS, never scrolls. The panel is the width of the page it edits, and in
   Shipmate that is 800px — not enough for one line. A toolbar that scrolls
   sideways hides its own controls behind an edge with nothing to say they are
   there; a toolbar on two rows just has two rows. The groups are the seams it
   breaks along, so a break never lands in the middle of one idea. */
#dock .grp{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-width:0}
body.preview #dock{display:none}

/* THE ART THUMBNAIL. The whole picture, with the part the header actually
   shows drawn on it — the crop as a picture instead of as a percentage. The
   rest is dimmed by an overlay ON THE THUMB ONLY, so what is off-frame is
   still visible: you can see what you are cutting off, which is the entire
   point of showing it. */
.artthumb{
  position:relative;display:block;flex:0 0 auto;height:30px;
  border-radius:4px;overflow:hidden;background:#000 center/cover no-repeat;
  box-shadow:0 0 0 1px rgba(255,255,255,.18);
}
/* One element does both jobs: a hairline around the visible region, and a huge
   spread shadow that dims everything outside it — clipped by the thumb's own
   overflow. No second layer to keep in sync, and the framed part stays at full
   strength while the rest is knocked back but still readable. */
.artwin{
  position:absolute;
  box-shadow:0 0 0 1.5px var(--sel), 0 0 0 999px rgba(8,8,10,.62);
  transition:left .06s linear, top .06s linear, width .06s linear, height .06s linear;
}

input[type=range].mini{width:82px;accent-color:var(--sel);height:3px}

/* ── The bottom pill — page-wide choices only ─────────────────────────────── */
#bar{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;
  display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:13px;max-width:calc(100vw - 32px);
}
#bar .thumb{width:38px;height:27px;border-radius:5px;overflow:hidden;position:relative;
  cursor:pointer;border:2px solid transparent;flex:0 0 auto;background:#000;padding:0}
#bar .thumb.on{border-color:var(--sel)}
#bar .thumb svg,#bar .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* Every control in the pill is an editing control, and the one thing that was
   not — the view switch — has moved to the window's corner. So in preview the
   pill has nothing left to hold and goes away entirely, instead of hanging
   there as an empty piece of glass. */
body.preview #bar{display:none}

/* ── Edit affordances on the site itself ──────────────────────────────────── */
/* Nothing here paints in preview mode, so what you see is what a visitor sees. */
/* A SOFT FILLED RECTANGLE, not a dashed box. The dashed outline was borrowed
   from wireframes: it draws a hard technical line around finished artwork and
   makes an ordinary hover look like an error state. This is a rounded shape
   with a 5% white wash and no stroke at all — it says "this is a thing you can
   touch" without drawing anything.

   Built as an ::after rather than an outline, because an outline cannot be
   filled and does not follow a radius reliably. pointer-events:none so it can
   never intercept the click it is advertising.

   `position:relative` here is safe: every rule that positions one of these
   elements is prefixed with #site and therefore wins on specificity — the
   absolute `.el` pieces and the hero stay exactly where they were. */
body:not(.preview) [data-edit]{position:relative}
body:not(.preview) [data-edit]:not([data-edit=art]):not([data-edit=strip])::after{
  content:'';position:absolute;inset:-6px;border-radius:10px;z-index:8;
  background:rgba(255,255,255,0);pointer-events:none;transition:background .12s;
}
/* Only the innermost thing under the pointer lights up. Without :has(), a
   field inside the metadata band would light both itself and the band. */
body:not(.preview) [data-edit]:hover:not(:has([data-edit]:hover))::after{background:rgba(255,255,255,.05)}
body:not(.preview) [data-edit].sel::after{background:rgba(255,255,255,.10)}
/* The two CONTAINERS say it a different way — the docked panel and the dim —
   so a wash over the whole key art on top of that would be one signal too
   many, and a 10% white film over the artwork is the least attractive way this
   page could ask for attention. */
/* Typing keeps the same language — the container's rectangle fills a little
   more — rather than the browser's own hard focus ring. */
body:not(.preview) [contenteditable]:focus{outline:none}
body:not(.preview) [data-edit]:focus-within::after{background:rgba(255,255,255,.10)}
/* The footer's studio and date are editable text with no editable container
   around them, so they carry their own soft rectangle. */
body:not(.preview) .foot-s [contenteditable]:focus{
  background:rgba(255,255,255,.10);border-radius:5px;box-shadow:0 0 0 4px rgba(255,255,255,.10);
}
/* Text being edited must never be dragged out from under the caret. */
[contenteditable]{cursor:text}

/* THE DIM. Opacity on the other top-level sections — never a covering layer,
   which would eat every click on the page underneath (the bug that once froze
   this editor). Clicks still land, so you can go straight from one area to
   another without dismissing anything first. */
#site.focus > *{transition:opacity .18s}
#site.focus > *:not(.spot){opacity:.3}
body.preview #site.focus > *{opacity:1}

/* A file dragged over something that will accept it. An inset ring rather than
   an outline, so it reads as "into here" and cannot shift the layout. */
/* #site-prefixed on purpose: it has to beat the hover rectangle above, which
   is a rule on the same pseudo-element. A file hovering over a drop target is
   a stronger statement than "you could click this", so it wins. */
#site .drop-on{position:relative}
#site .drop-on::after{
  content:'';position:absolute;inset:0;z-index:9;pointer-events:none;border-radius:10px;
  box-shadow:inset 0 0 0 3px var(--sel);background:rgba(82,186,255,.12);
}

/* Section hide chip, revealed on hover of its own section */
.chip-hide{
  position:absolute;top:10px;right:12px;z-index:30;display:flex;align-items:center;gap:5px;
  padding:4px 9px;border-radius:999px;cursor:pointer;font:inherit;font-size:10.5px;font-weight:600;
  color:#E8EAEE;background:rgba(16,16,19,.8);border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(8px);opacity:0;transition:opacity .14s;
}
[data-sect]{position:relative}
body:not(.preview) [data-sect]:hover > .chip-hide{opacity:1}
body.preview .chip-hide{display:none}

/* No corner grip: the Assets crop tool sizes and frames things with plain
   controls in a row (.shot-edit-controls / .shot-ar-btns) and reserves the
   pointer for dragging only. Scale here is the slider in the toolbar, for the
   same reason — one gesture, one meaning. */

.hint{
  position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:59;
  padding:6px 13px;border-radius:999px;font-size:11.5px;color:#C9CED6;pointer-events:none;
  opacity:0;transition:opacity .2s;
}
.hint.show{opacity:1}


/* ==========================================================================
   THE GENERATED SITE
   --a accent      --cta buy-button colour      --sc scrim strength (0–1)
   ========================================================================== */
/* The page is a CONTAINER, and every responsive rule below queries it rather
   than the window. That is not pedantry here: the page lives inside a
   Shipmate panel whose width the bottom bar changes, so a @media rule keyed to
   the browser window would keep reporting "desktop" while the page was being
   squeezed to 420px, and nothing would reflow. Container queries ask the only
   question that matters — how much room did the panel actually give me. */
#site{--a:#52BAFF; --cta:#FF4D8D; --sc:.85; position:relative; min-height:100%;
      container-type:inline-size; container-name:page;
      /* THE MEASURE. One centred column governs every section — and, via
         .hero-stage below, the logo and button too. --pad is each skin's own
         gutter, declared per skin so the stage can subtract exactly the same
         one the content bands use. */
      /* TWO measures, on purpose.
         --page    the full column: key art, screenshots, press — anything the
                   eye scans rather than reads.
         --measure the reading column: the description, and now the metadata
                   band with it, so their left and right edges line up instead
                   of the band overhanging the text it sits above.
         Each skin declares its own --measure to match wherever its description
         actually lands. */
      --page:1200px; --measure:800px; --pad:clamp(20px,5vw,60px);
      /* What the hero's stage must inset itself by. Equals --pad when the
         hero runs full bleed, and 0 when the skin already gives the hero a
         margin of its own — see .hero-stage. */
      --stage-pad:var(--pad);
      /* THE HERO'S HEIGHT. One number, honoured by all three skins, so the key
         art is always the same size whichever look is picked. The skins used
         to each set their own (a vh-clamp here, an aspect-ratio there), which
         meant the art changed size when you only meant to change the styling.

         625, not 800: on a 13" laptop the browser gives a page roughly 700–750
         css px of height, so an 800px hero filled the whole first screen and
         the page looked like it ended there. At 625 the top of the metadata
         band shows under it — enough to say "keep going" without stealing from
         the art. The one exception is fit:'whole', where the art's own
         proportions decide the height instead. */
      --hero-h:625px}
/* And 50px less again on a short screen. This is the one place a viewport query
   is right rather than a container query: every other rule in this file asks how
   WIDE the panel is, but this one is about how much vertical room the reader
   actually has — which the container cannot tell us, because the page scrolls
   inside it and reports the height it wants, not the height it gets.
   860px is where a 13" laptop lands once the OS bar, the browser chrome and
   Shipmate's own frame have taken their share. */
@media (max-height:860px){ #site{--hero-h:575px} }
/* AND 50px LESS AGAIN WHEN THE PANEL IS NARROW.

   Two independent reasons to shorten the header, worth 50px each, and they
   stack: a short screen has less room to give it, and a narrow panel — 800px,
   the pages pill in Shipmate — is not showing the art at anything like the
   size it was cropped for, so the art earns less of the fold and the content
   below it should come up to meet the reader.

   The cut lives on .hero rather than on #site because a container query styles
   the DESCENDANTS of its container, never the container itself — and #site is
   the container. Substituting on .hero is what makes the override actually
   take. */
#site .hero{--hero-cut:0px}
@container page (max-width:820px){ #site .hero{--hero-cut:50px} }
#site *{box-sizing:border-box}
/* Kill the browser's native image drag. Without this, pressing on the key art
   starts Chrome's own drag-and-drop with a translucent ghost of the image, the
   pointer stream is hijacked, and the pan only begins after you let go and
   press a second time. The crop tool avoids it by putting pointer-events:none
   on .shot-edit-img; here the art itself has to stay the drag target, so it is
   suppressed directly instead (plus draggable="false" and a dragstart guard —
   all three are needed to cover every browser). */
#site img{display:block;max-width:100%;-webkit-user-drag:none;user-select:none}
#site .hero{user-select:none;-webkit-user-select:none}
#site .kart{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* THE KEY ART ITSELF is placeable — pan and zoom, on the hero's direct child
   only (screenshots and the video poster reuse .kart and must not inherit the
   hero's framing).

   TWO properties, because they do genuinely different things:

   · object-position MOVES THE CROP inside the box. With object-fit:cover the
     picture is scaled to fill and the excess is clipped AT THE ELEMENT'S EDGE,
     so this is the only way to choose which part of it you see. It reveals
     more art, and it can never leave a gap: 0% and 100% are the picture's own
     edges. This is what dragging should spend itself on first.
   · transform:translate MOVES THE WHOLE ELEMENT, clipped content and all. It
     reveals nothing — it slides the already-cropped picture out of the window
     and leaves empty space behind. Useless for reframing, which is what the
     first version of this got wrong: it panned with translate, so dragging
     shifted the picture instead of choosing the crop. It is kept only to reach
     the extra overflow that ZOOM creates, where there is no cover slack left
     to spend.

   So a drag fills the cover slack first (real reframing) and only then starts
   translating (the zoomed overflow). See applyArtPan. */
#site .hero{--tx:0px;--ty:0px;--az:1}
#site .hero > .kart{transform:translate(var(--tx),var(--ty)) scale(var(--az));transform-origin:center}
body:not(.preview) #site .hero[data-edit].sel{outline-offset:-3px}
body:not(.preview) #site .hero > .kart{cursor:grab}
body:not(.preview) #site .hero.panning > .kart{cursor:grabbing}

/* THE HERO STAGE — the content column, projected onto the key art.
   The art itself stays full bleed; that is what a hero is for. But the logo and
   the button are positioned against THIS box, not against the artwork, because
   their percentages have to mean the same thing as the layout underneath: put
   the logotype on the left third and it lands on the left third of the text
   column below it, at every window width. Position them against the full-bleed
   art instead and the alignment drifts apart the wider the screen gets, which
   is exactly the bug this prevents.
   pointer-events:none so it never intercepts a press meant for panning the art
   — only its children take the pointer back. */
#site .hero-stage{
  position:absolute;top:0;bottom:0;left:0;right:0;margin:0 auto;
  /* --measure, NOT --page. The reading column is where the metadata band, the
     description and the screenshots actually sit, so it is what the eye reads
     as the page's margin. Measuring the hero against the full 1200 column put
     its left edge 200px outside the content in Classic: a logotype flush to
     the stage looked flush to nothing, and hung off the side of the page it
     was supposed to line up with.
     It also bounds the drag, since positions are clamped to the stage — so
     nothing can be placed outside the margins by hand either.

     --stage-pad, not --pad: in Classic the hero is full bleed, so the stage has
     to inset itself by the page gutter to line up with the bands below. In
     Boutique and Arcade the hero is a slab with its OWN margin, which already
     is that gutter — subtracting --pad again inset the hero column by a second
     gutter, and the title sat a margin's width inside the metadata beneath it.
     So those skins set --stage-pad to 0 and let their margin do the work. */
  width:min(calc(100% - 2 * var(--stage-pad)), var(--measure));
  pointer-events:none;
}
#site .hero-stage > *{pointer-events:auto}

/* ── 1 · HERO — two independent, draggable elements ───────────────────────── */
/* The logotype and the CTA are separate: a call to action is not part of the
   logo, and pinning them together meant you could never put the button in the
   clear space the art actually leaves you. Each keeps its own x/y as a
   percentage of the hero box, so both survive every viewport width. */
#site .el{
  position:absolute; z-index:5; cursor:grab; user-select:none;
  /* ANCHORED, on both axes, to the edge it was aligned to.

     Vertically that is always the top: when an element's height changes — the
     tagline rewrapping, the logotype resized — a centre anchor grows it in
     both directions and shifts everything lined up against it.

     Horizontally the anchor follows the alignment. A left-aligned element is
     anchored by its LEFT edge, so making it bigger grows it rightward and it
     stays flush to the margin. Anchoring everything by the centre, which is
     what this did, meant a left-aligned tagline drifted off the margin the
     moment you touched its size slider — the same bug as the vertical one,
     left uncorrected on the other axis. */
  transform:translate(-50%,0);
  /* REQUIRED, not cosmetic. With only `left` set, an absolutely positioned box
     is sized shrink-to-fit, and its "available width" is the gap from `left` to
     the containing block's right edge. Dragging rightwards shrinks that gap,
     the box shrinks with it, and the global `#site img{max-width:100%}` then
     crushes the logotype against the new parent width — the logo visibly shrank
     as it moved right. translate(-50%,-50%) runs after layout, so it cannot
     undo any of it. `max-content` makes the width intrinsic and independent of
     available space. Overflowing the hero at the extremes is fine: the drag
     clamps to 4–96% and the hero clips. */
  width:max-content; max-width:none;
}
/* Same as the crop tool: the pointer belongs to the wrapper, and the artwork
   inside must not swallow the press (cf. .shot-edit-img's pointer-events:none
   in style.css). Text stays clickable so the caret can still land in it. */
/* The anchor still moves the box; the TEXT is left in all three cases. A line
   of type centred inside its own box, sitting inside a hero that is already
   composed, only ever looks like a mistake. */
#site .el{text-align:left}
#site .el[data-align=left]  {transform:translate(0,0)}
#site .el[data-align=center]{transform:translate(-50%,0)}
#site .el[data-align=right] {transform:translate(-100%,0)}
#site .el img{pointer-events:none}
/* Only what can actually be dragged says so. The title and the button are
   placed by the layout — see FIXED — so they show a pointer rather than a hand
   promising a move that will not happen. */
#site .el.fixed{cursor:pointer}
#site.dragging .el.drag{cursor:grabbing}
body.preview #site .el{cursor:default}
body.preview #site .el.buy-el{cursor:pointer}

/* NO padding. It was here to give the selection outline room, which
   outline-offset already does — and its only other effect was to hold the
   letters 10px inside the element's own box, so a logotype flush to the
   margin still had its ink indented from the metadata band below it. With
   the padding gone the box edge IS the ink edge, and every alignment —
   dragged, buttoned or from a layout — lands the letters on the margin. */
#site .logo-el{color:#fff}
#site .logo-el .logo-ink{position:relative;display:block;overflow:visible}
#site .logo-el .logo-ink img{position:absolute;display:block;height:auto;max-width:none}
/* SHADOW, and one TINT.
   One --sh (0–1) drives offset, blur and alpha together, so the slider moves
   along a single believable curve instead of exposing three numbers nobody
   wants to balance by hand. drop-shadow (not box-shadow) follows the alpha
   channel, so it hugs the glyphs of a transparent PNG rather than boxing it.

   The tint is Original or White, and nothing else. It was cut once for being
   clutter and came back the moment a real asset needed it: Chants of Sennaar's
   logotype is dark, and on its own dark key art it disappears. No shadow can
   fix dark-on-dark — the only move is to knock the artwork out to white.
   brightness(0) crushes any colour to black and invert(1) lifts it to white,
   so this works on a coloured logotype too, not only a black one. Note both
   filters have to be declared in ONE property: a second `filter` on the same
   element replaces the first rather than adding to it, which would silently
   drop the shadow. */
#site .logo-el{--sh:.5}
#site .logo-el[data-tint=original] img{
  filter:drop-shadow(0 calc(var(--sh) * 14px) calc(var(--sh) * 34px) rgba(0,0,0,calc(var(--sh) * .8)));
}
#site .logo-el[data-tint=white] img{
  filter:brightness(0) invert(1)
         drop-shadow(0 calc(var(--sh) * 14px) calc(var(--sh) * 34px) rgba(0,0,0,calc(var(--sh) * .8)));
}
/* Weight is a choice, not a constant. 800 was too heavy for most key art —
   over a painted scene a heavy face reads as shouting — but a thin one loses
   against busy artwork, so the range on offer is Medium to Bold rather than
   the whole scale. Tracking tightens as the weight goes up, which is what
   keeps a heavy setting from looking loose. */
/* THE TITLE SIZES WITH THE PAGE, not with the screen. 64px was a constant, and
   at 1440 that is right — but the frame this editor actually gets in Shipmate
   is 800px wide, where a long name ("CHANTS OF SENNAAR") set at 64px runs
   straight into the Buy pill it is supposed to share a line with.

   cqw, not vw: the page is a container, and what matters is how wide the PANEL
   is, not the window around it. The clamp keeps 64px wherever there is room
   and never goes below something readable. --tz, the size slider, still
   multiplies on top, so the developer's own choice is unaffected. */
/* --tfit is the scale Text split applies so the name fits on ONE line. It is
   measured, not chosen: the natural width against the room the button leaves.
   1 everywhere else. */
#site .el[data-edit=title][data-nowrap] .title-w{white-space:nowrap}
#site .title-w{font-weight:var(--tw,600);letter-spacing:var(--tls,-.015em);line-height:.95;color:var(--tfg);
  font-size:calc(clamp(30px, 6cqw, 64px) * var(--tz) * var(--tfit, 1));
  text-shadow:0 calc(var(--ts) * 2px) calc(var(--ts) * 24px) rgba(0,0,0,calc(var(--ts) * .75))}
#site .title-el{--tz:1;--tfg:#fff;--ts:.6;--tw:600;--tls:-.015em}
#site .buy{
  display:inline-block;text-decoration:none;
  font-family:'IBM Plex Mono',monospace;font-weight:600;letter-spacing:0;text-transform:uppercase;
  background:var(--cta);transition:filter .18s;
}
#site .buy:hover{filter:brightness(1.08)}
/* Continuous scale, driven by one --bz, so the button grows the way the logo
   does. Padding scales with the type or a big button ends up a thin bar.
   --bs is its shadow, on the same single-lever curve as the logotype's --sh,
   but box-shadow rather than drop-shadow: this is a solid slab, so the shadow
   should follow its rectangle, not trace its letters.
   --bfg is the label colour. Two options only, black or white, because that is
   the actual decision — a mid-tone on a saturated pill is never the answer,
   and it is the one contrast choice that decides whether the CTA is legible. */
#site .buy-el{--bz:1;--bs:.45;--bfg:#fff}
#site .buy-el .buy{
  font-size:calc(15px * var(--bz));
  padding:calc(15px * var(--bz)) calc(40px * var(--bz));
  color:var(--bfg);
  box-shadow:0 calc(var(--bs) * 12px) calc(var(--bs) * 30px) rgba(0,0,0,calc(var(--bs) * .8));
}

/* THE PAGE HEADER — just the logotype, small, in the corner. No frosted bar of
   its own: the browser chrome above it is already the glass, and stacking a
   second translucent bar directly under the first only muddies both.
   Offset clear of that chrome, which overlays the top of the page in both
   modes — preview keeps the browser bar, so this clearance never changes. */
#site .hero-head{
  position:absolute;left:0;z-index:7;
  top:calc(var(--chrome-h, 0px) + 24px);
}
#site .hero-head .hh-word{font-weight:800;font-size:19px;letter-spacing:-.01em;color:#fff;
  text-shadow:0 3px 14px rgba(0,0,0,.6)}
#site .hero-head img{filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}

/* THE TAGLINE under the logotype. Its own element, so it drags, aligns and
   sizes like everything else in the hero. max-width in ch, not px, so the line
   breaks on a sensible number of words at any size. */
#site .hook-el{--hz:1;--hfg:#fff;--hs:.6}
#site .hook{
  display:block;color:var(--hfg);font-weight:500;
  font-size:calc(21px * var(--hz));line-height:1.32;max-width:40ch;
  /* ONE soft shadow. A second tight layer was tried to bite harder against
     bright art and it reads as a dirty edge on letterforms this thin — the
     halo sits close enough to be seen as part of the glyph rather than behind
     it. A single wide, low-contrast blur separates the line from the picture
     without ever drawing attention to itself, and the slider goes to 0 if
     even that is too much. */
  text-shadow:0 calc(var(--hs) * 2px) calc(var(--hs) * 22px) rgba(0,0,0,calc(var(--hs) * .7));
  /* pre-line so a typed Enter survives as a real break while ordinary wrapping
     still happens.
     NO overflow:hidden here. Capping the height that way clipped the text
     shadow against the text box — the soft blur got sliced off in a straight
     line under the words and read as a hard, fake edge. A shadow has to be
     free to spill. The two-line limit is enforced while TYPING instead (see
     the input handler), which is where a limit belongs anyway: it stops the
     third line from existing rather than hiding it after the fact. */
  white-space:pre-line;
}
#site[data-tpl=boutique] .hook{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:calc(26px * var(--hz))}
#site[data-tpl=arcade]   .hook{font-family:Silkscreen,monospace;font-size:calc(13px * var(--hz));line-height:1.6}

/* The availability marks used AS the call to action, instead of a pill.
   They get the same shadow lever as the button and the tagline, because over
   artwork a flat white mark can land on a white cloud and vanish. drop-shadow
   on the link, so it follows each mark's silhouette — the SVGs take
   currentColor and the PNG fallbacks are already white. */
#site .stores-el .stores{--store-h:calc(30px * var(--bz));--store-gap:calc(24px * var(--bz));color:var(--bfg)}
#site .stores-el .stores a{
  filter:drop-shadow(0 calc(var(--bs) * 3px) calc(var(--bs) * 13px) rgba(0,0,0,calc(var(--bs) * .9)));
}

/* GRID REFERENCES — the frame's thirds and centre, in the same hairline-white
   language as the crop tool's .shot-crop-frame. Fixed lines, not a crosshair
   following the cursor: a crosshair only tells you where the element already
   is, which you can see; what you need is where the frame's thirds are, so you
   can land ON one. Elements snap to whichever line they come near and that
   line lights up to confirm. Lines never change width when they light up — a
   1px→2px swap shifts them half a pixel, which reads as the guide jittering.
   Shown whenever something in the hero is selected, so the reference is there
   while you judge the framing, not only during the drag itself. */
#site .guides{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .15s}
#site.dragging .guides,
#site .hero:has(.el.sel) .guides,
#site .hero.sel .guides{opacity:1}
body.preview #site .guides{opacity:0 !important}
#site .guides span{position:absolute;background:rgba(255,255,255,.22);transition:background .12s,box-shadow .12s}
#site .guides .gv{top:0;bottom:0;width:1px}
#site .guides .gh{left:0;right:0;height:1px}
#site .guides .mid{background:rgba(255,255,255,.4)}
#site .guides .hit{background:var(--a);box-shadow:0 0 10px color-mix(in srgb,var(--a) 70%,transparent)}

/* ALIGNMENT GUIDES — relationships between the two hero elements, as opposed
   to the fixed grid above. They appear only at the instant one element lines
   up with the other's centre or one of its edges, and they get their own
   colour (Shipmate's --magenta) precisely because they mean something
   different: the grid says "you are on a third of the frame", these say "you
   are aligned with that other thing". Sharing the accent colour would blur
   two facts the eye needs to keep apart. */
#site .aguides{position:absolute;inset:0;z-index:6;pointer-events:none}
#site .aguides span{position:absolute;background:#FF3B76;opacity:0;transition:opacity .07s;
  box-shadow:0 0 9px rgba(255,59,118,.85)}
#site .aguides .av{top:0;bottom:0;width:1px}
#site .aguides .ah{left:0;right:0;height:1px}
#site .aguides span.on{opacity:1}

/* ── 2 · STRIP ────────────────────────────────────────────────────────────── */
/* Three per row, six fields, two full rows. A complete rectangle beats the
   ragged 4 + 1 it replaced: nothing dangles, the two rows read as one block,
   and at three columns each field is wide enough to hold a studio name or a
   list of genres without wrapping into a mess. auto-fit used to do the
   opposite, packing in as many as would technically fit. */
/* The band is ONE grid, 1200 wide and centred, three equal columns, two rows.
   The measure and the centring live here rather than being repeated per skin —
   they were, and Arcade had quietly been left out of it, so its band ran the
   full width while the other two were capped.
   justify-items:start keeps each field hugging the left of its own column
   instead of being stretched across it. */
#site .strip-in{
  width:100%;max-width:var(--measure);margin-inline:auto;
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:30px 40px;align-items:start;justify-items:start;
}
/* Each field is a <dl>, and a <dl> carries a 1em top and bottom margin from the
   browser's own stylesheet. That was silently adding 16px above and below every
   cell, so a 28px row gap rendered as 60 and the two rows drifted apart. The
   grid's gap should be the only thing setting this rhythm. */
#site .sf,#site .fact{margin:0}
@container page (max-width:900px){ #site .strip-in{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container page (max-width:400px){ #site .strip-in{grid-template-columns:minmax(0,1fr)} }
/* TYPOGRAPHY RULE for the whole generated page: labels in IBM Plex Mono with
   NO tracking, content in Inter. Mono is doing a job here — it says "this is a
   field name, not prose" — but letter-spacing on top of a monospace face is
   belt and braces: the fixed advance width already spaces it out, and adding
   tracking on top just loosens it into a rattle. Content never uses mono. */
#site .sf dt{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0;
  text-transform:uppercase;margin-bottom:9px;white-space:nowrap}
#site .sf dd{margin:0;font-size:14.5px;line-height:1.5}
#site .stores{display:flex;align-items:center;gap:var(--store-gap,16px);flex-wrap:wrap}
#site .stores a{display:block;color:inherit;transition:.18s}
#site .stores a:hover{transform:translateY(-2px)}
/* The SVG marks fill a square box and inherit the band's text colour, so they
   need no per-skin treatment. The PNG fallbacks are baked white, hence the
   invert on the one light skin (see Boutique). */
#site .stores .pi{display:block;width:var(--store-h,24px);height:var(--store-h,24px);opacity:.92}
#site .stores a:hover .pi{opacity:1}
#site .stores .pi svg{display:block;width:100%;height:100%}
#site .stores img{height:var(--store-h,24px);width:auto;opacity:.92;transition:.18s}
#site .stores a:hover img{opacity:1}

/* ── 3 · LEAD ─────────────────────────────────────────────────────────────── */

/* SCREENSHOT VIEWER. Lives outside #site so a re-render never disturbs it, and
   it is a real feature of the generated page rather than editor chrome —
   it works in preview too, because that is when a visitor would use it. */
/* display:none BY DEFAULT, and the open state adds it back.
   The first version relied on the `hidden` attribute while this rule said
   `display:grid`. That does not work: `[hidden]{display:none}` lives in the
   BROWSER's stylesheet, and any author rule beats it regardless of
   specificity. So the viewer never actually went away — it stayed stretched
   across the whole viewport at opacity:0, invisible but still painting a
   zoom-out cursor and swallowing every click on the page. It looked exactly
   like the app had frozen. Nothing was frozen; the page was under glass.
   Visibility is a class here, and the attribute is belt and braces. */
.lightbox{
  position:fixed;inset:0;z-index:200;display:none;place-items:center;
  padding:clamp(16px,4vw,56px);cursor:zoom-out;
  /* A SOLID ground, not a backdrop-filter. This covers the whole viewport, and
     a full-screen backdrop blur is about the most expensive thing you can ask
     a compositor for — worse still while its opacity is animating, since the
     blur has to be recomputed over the entire page every frame. On a desktop
     webview without GPU acceleration that does not degrade, it locks up. The
     small frosted bar at the top of the frame is fine: it blurs a strip, once,
     and never animates. */
  background:rgba(7,7,9,.96);
  opacity:0;transition:opacity .16s;
}
.lightbox.open{display:grid}
.lightbox.on{opacity:1}
[hidden]{display:none !important}
.lightbox img{
  max-width:100%;max-height:100%;border-radius:8px;
  box-shadow:0 40px 120px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.10);
}
.lightbox .lb-hint{
  position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  font-size:11.5px;color:#7d838c;pointer-events:none;
}
/* The cursor is the affordance — nothing else on the page zooms. */
#site .shots img{cursor:zoom-in}

/* ── 4 · VIDEO ────────────────────────────────────────────────────────────── */
#site .video{position:relative;aspect-ratio:16/9;overflow:hidden;cursor:pointer;background:#000}
#site .video .vbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.55)}
#site .video .play{position:absolute;inset:0;display:grid;place-items:center}
#site .video .play i{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;
  background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.85);backdrop-filter:blur(6px);transition:.2s}
#site .video:hover .play i{background:var(--cta);border-color:var(--cta);transform:scale(1.07)}
#site .video .play svg{width:26px;height:26px;fill:#fff;margin-left:4px}
#site .vlabel{position:absolute;left:0;bottom:0;padding:14px 18px;font-family:'IBM Plex Mono',monospace;
  font-size:10px;letter-spacing:0;text-transform:uppercase;color:rgba(255,255,255,.82);
  text-shadow:0 2px 10px rgba(0,0,0,.7)}
/* The empty trailer slot, in the same language as everything else you can act
   on: a filled rounded rectangle, no stroke. It was dashed — the wireframe
   convention for "something goes here" — but a page that has one dashed box
   and one filled one is a page with two vocabularies for the same idea. */
#site .slot{display:grid;place-items:center;gap:8px;text-align:center;padding:44px;
  background:rgba(255,255,255,.05);border-radius:12px;
  color:color-mix(in srgb,var(--a) 80%,#888);font-size:12px}
#site[data-tpl=boutique] .slot{background:rgba(30,24,12,.05)}
#site .slot svg{width:26px;height:26px;opacity:.7}

/* ── 6 · PRESS ────────────────────────────────────────────────────────────── */
#site .quotes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@container page (max-width:760px){#site .quotes{grid-template-columns:minmax(0,1fr)}}
#site .quote p{margin:0 0 10px;font-size:15.5px;line-height:1.6}
#site .quote cite{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0;
  text-transform:uppercase;font-style:normal;opacity:.6}

/* ── 7 · FACTS ────────────────────────────────────────────────────────────── */
#site .facts-in{width:100%;max-width:var(--page);margin-inline:auto;
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 32px;align-items:start;justify-items:start}
@container page (max-width:760px){#site .facts-in{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container page (max-width:400px){#site .facts-in{grid-template-columns:minmax(0,1fr)}}
#site .fact dt{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0;
  text-transform:uppercase;margin-bottom:6px;opacity:.5}
#site .fact dd{margin:0;font-size:14px;line-height:1.55}

/* ── 8 · ABOUT — the long description, under the trailer ──────────────────── */
/* pre-wrap so a developer can put blank lines between paragraphs and have them
   survive; the text is edited as plain text, and this is what makes that
   editing honest about what it will look like. */
#site .about{font-size:15px;line-height:1.72;white-space:pre-wrap;opacity:.9}
/* The About area is several blocks now — one per submission field — and they
   have to read as ONE piece of writing, so the gap between them is a
   paragraph break and nothing more. The day History and About the Developer
   become their own scroll sections, this is where they stop being paragraphs
   and start being sections. */
#site .about + .about{margin-top:1.15em}
#site[data-tpl=boutique] .about{font-size:15.5px;line-height:1.78}

/* ── 9 · FOOTER ───────────────────────────────────────────────────────────── */
/* On the READING column in every skin, like the metadata band: these are five
   short lines of text, and a row of them stretched across the full 1200 would
   have the first and last a screen apart. */
#site .contact .band-in{max-width:var(--measure)}
/* Studio and date on one side, the ways to reach them on the other — and it
   stacks rather than squeezes, because a footer that wraps mid-line reads as
   broken in a way a two-row footer does not. */
#site .foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:14px 24px;padding-top:22px;border-top:1px solid currentColor}
#site[data-tpl=classic]  .foot{border-color:rgba(255,255,255,.10)}
#site[data-tpl=boutique] .foot{border-color:rgba(30,24,12,.12)}
#site[data-tpl=arcade]   .foot{border-top:3px solid var(--a)}
#site .foot-who{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;opacity:.62}
#site .foot-s [contenteditable]{cursor:text}
@container page (max-width:560px){ #site .foot{justify-content:flex-start} }
/* Wraps rather than scrolls, and each channel keeps its icon and its handle
   together — the pair is one thing, so `inline-flex` on the link and `gap` on
   the row, never a grid that could break them onto separate lines. */
#site .contact-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* A rounded square with a filled ground and no stroke — the same shape and the
   same 5% wash as every other "you can act on this" surface in the editor. */
#site .cc{
  display:grid;place-items:center;width:38px;height:38px;
  border-radius:11px;text-decoration:none;color:inherit;
  background:rgba(255,255,255,.05);transition:background .14s,transform .14s;
}
#site .cc svg{width:19px;height:19px;display:block;opacity:.9}
#site .cc:hover{background:rgba(255,255,255,.11)}
#site .contact-empty{margin:0;font-size:13.5px;opacity:.45}

/* Boutique is paper, so the wash is ink rather than light. */
#site[data-tpl=boutique] .cc{background:rgba(30,24,12,.06)}
#site[data-tpl=boutique] .cc:hover{background:rgba(30,24,12,.12)}
/* Arcade rounds nothing and fills with its accent on hover — the same language
   as its hero border and its section rules. */
#site[data-tpl=arcade] .cc{border-radius:0;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 2px var(--a)}
#site[data-tpl=arcade] .cc:hover{background:var(--a);color:#0b0616}


/* ══════════════════════════════════════════════════════════════════════════
   SKIN 1 — CLASSIC   (Jaco's layout)
   ═════════════════════════════════════════════════════════════════════════ */
#site[data-tpl=classic]{background:#0C0C0F;color:#F2F3F5;font-family:Inter,sans-serif}
#site[data-tpl=classic] .hero{position:relative;height:calc(var(--hero-h) - var(--hero-cut,0px));overflow:hidden}
/* Two layers, deliberately. The lower one is this skin's IDENTITY — art
   dissolving into the page — and never varies, or the hero would end on a
   visible seam. The upper one is the adjustable scrim, which is what has to
   change between dark sci-fi art and Spilled!'s bright cosy art. Tuning them
   as one gradient made every scrim below ~80% show that seam. */
#site[data-tpl=classic] .hero::after{
  content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:
    linear-gradient(to bottom,rgba(12,12,15,calc(var(--sc)*.45)) 0%,transparent 32%,transparent 52%,rgba(12,12,15,calc(var(--sc)*.7)) 100%),
    linear-gradient(to bottom,transparent 62%,#0C0C0F 100%);
}
#site[data-tpl=classic] .title-w{}
#site[data-tpl=classic] .buy{border-radius:999px}
#site[data-tpl=classic] .strip{padding:6px clamp(20px,5vw,60px) 46px}
#site[data-tpl=classic] .sf dt{color:#8A8F98}
#site[data-tpl=classic] .sf dd{color:#EDEFF2}
#site[data-tpl=classic] .band{padding:0 clamp(20px,5vw,60px) clamp(48px,6vw,76px)}
/* The one wrapper that is deliberately NARROWER than --page: running body text
   across a 1200px line is unreadable, so prose gets its own measure and only
   the full-width blocks (.band.wide) take the whole column. */
#site[data-tpl=classic] .band-in{max-width:var(--measure,800px);margin:0 auto}
#site[data-tpl=classic] .band.wide .band-in{max-width:var(--page)}
/* The accent's job in the quiet skins: the section labels. Small, mono,
   repeated down the page and far from the artwork — which is the only place
   a second colour can live on a page whose whole point is the key art.
   These were a fixed grey, which is how the Accent control ended up doing
   nothing at all outside Arcade. */
#site[data-tpl=classic] .h2{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0;
  text-transform:uppercase;color:var(--a);margin:0 0 16px}
#site[data-tpl=classic] .lead p{font-size:clamp(18px,2.1vw,23px);line-height:1.55;margin:0;color:#DDE0E5}
#site[data-tpl=classic] .video{border-radius:10px}
#site[data-tpl=classic] .shots{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
#site[data-tpl=classic] .shots > *{flex:0 0 clamp(280px,42vw,540px);scroll-snap-align:start;
  border-radius:10px;overflow:hidden;aspect-ratio:16/9;position:relative}
#site[data-tpl=classic] .quote{border-left:2px solid var(--a);padding-left:16px}
#site[data-tpl=classic] .quote p{color:#DDE0E5;font-weight:300}
#site[data-tpl=classic] .facts{border-top:1px solid rgba(255,255,255,.08);padding:44px clamp(20px,5vw,60px) 70px}
#site[data-tpl=classic] .fact dd{color:#CDD2DA}

/* ══════════════════════════════════════════════════════════════════════════
   SKIN 2 — BOUTIQUE
   ═════════════════════════════════════════════════════════════════════════ */
/* Boutique's description is the wide two-column lead (cover beside text), so
   its reading measure IS the full column and the band matches that instead. */
#site[data-tpl=boutique]{--measure:var(--page);--stage-pad:0px;background:#F4F1EA;color:#191713;font-family:Inter,sans-serif}
#site[data-tpl=boutique] .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;
  flex-wrap:wrap;padding:22px clamp(20px,5vw,60px);border-bottom:1px solid rgba(0,0,0,.09)}
#site[data-tpl=boutique] .studio{font-family:'Instrument Serif',Georgia,serif;font-size:19px}
#site[data-tpl=boutique] .topnav{display:flex;gap:22px;font-size:12px;color:#6c665c}
#site[data-tpl=boutique] .hero{position:relative;margin:clamp(24px,4vw,40px) clamp(20px,5vw,60px) 34px;
  height:calc(var(--hero-h) - var(--hero-cut,0px));overflow:hidden;border-radius:3px;box-shadow:0 26px 70px rgba(30,24,12,.22)}
#site[data-tpl=boutique] .hero::after{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(to top,rgba(12,10,8,calc(var(--sc)*.5)),transparent 55%)}
#site[data-tpl=boutique] .title-w{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
#site[data-tpl=boutique] .buy{border-radius:2px}
#site[data-tpl=boutique] .strip{padding:0 clamp(20px,5vw,60px) 44px}
#site[data-tpl=boutique] .strip-in{padding-bottom:34px;border-bottom:1px solid rgba(0,0,0,.1)}
#site[data-tpl=boutique] .sf dt{color:#8c8375}
#site[data-tpl=boutique] .sf dd{color:#2e2921}
/* Scoped to the metadata band. Unscoped, this also inverted the marks when
   they are used as the hero's call to action — where they sit on artwork, not
   on paper — and turned them black over the key art. */
#site[data-tpl=boutique] .strip .stores img{filter:invert(1);opacity:.5}
#site[data-tpl=boutique] .strip .stores a:hover img{opacity:.85}
#site[data-tpl=boutique] .band{padding:0 clamp(20px,5vw,60px) clamp(46px,6vw,74px)}
#site[data-tpl=boutique] .band-in{max-width:var(--page);margin:0 auto}
#site[data-tpl=boutique] .h2{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0;
  text-transform:uppercase;color:var(--a);margin:0 0 18px}
/* The 748×900 vertical capsule — Steam's own portrait spec, and the one
   delivered asset the other two skins have nowhere to put. On a paper ground
   it reads as a book cover, which is exactly this skin's idea. */
#site[data-tpl=boutique] .lead-in{display:grid;grid-template-columns:190px 1fr;gap:clamp(28px,5vw,54px);align-items:start}
@container page (max-width:760px){#site[data-tpl=boutique] .lead-in{grid-template-columns:1fr}}
#site[data-tpl=boutique] .cover{width:190px;border-radius:2px;box-shadow:0 16px 40px rgba(30,24,12,.28)}
/* Sized down from its old display scale now that the mini description is a
   real paragraph — 40px over four lines stopped being a lead and became a
   wall. The serif stays: it is this skin's whole idea. */
#site[data-tpl=boutique] .lead p{font-family:'Instrument Serif',Georgia,serif;font-weight:400;
  font-size:clamp(20px,2.3vw,27px);line-height:1.34;margin:0;letter-spacing:-.01em;color:#191713}
#site[data-tpl=boutique] .video{border-radius:3px;box-shadow:0 20px 50px rgba(30,24,12,.2)}
#site[data-tpl=boutique] .shots{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@container page (max-width:640px){#site[data-tpl=boutique] .shots{grid-template-columns:1fr}}
#site[data-tpl=boutique] .shots > *{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:3px}
#site[data-tpl=boutique] .shots > *:first-child{grid-column:1/-1;aspect-ratio:21/9}
#site[data-tpl=boutique] .quote p{font-family:'Instrument Serif',Georgia,serif;font-size:21px;line-height:1.35;color:#231f19}
#site[data-tpl=boutique] .quote cite{color:#6c665c;opacity:1}
#site[data-tpl=boutique] .facts{border-top:1px solid rgba(0,0,0,.09);padding:44px clamp(20px,5vw,60px) 72px}
#site[data-tpl=boutique] .fact dt{color:#9a9184;opacity:1}
#site[data-tpl=boutique] .fact dd{color:#2e2921}

/* ══════════════════════════════════════════════════════════════════════════
   SKIN 3 — ARCADE
   ═════════════════════════════════════════════════════════════════════════ */
#site[data-tpl=arcade]{--measure:900px;--pad:clamp(18px,3vw,28px);--stage-pad:0px;background:#0B0616;color:#F3E9FF;font-family:Inter,sans-serif;position:relative}
#site[data-tpl=arcade]::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:20;opacity:.5;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
#site[data-tpl=arcade] .marquee{background:var(--a);color:#0B0616;overflow:hidden;white-space:nowrap;
  font-family:Silkscreen,monospace;font-size:11px;padding:7px 0;letter-spacing:.06em}
#site[data-tpl=arcade] .marquee span{display:inline-block;animation:mq 26s linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#site[data-tpl=arcade] .hero{position:relative;margin:clamp(18px,3vw,28px);height:calc(var(--hero-h) - var(--hero-cut,0px));
  overflow:hidden;border:3px solid var(--a);box-shadow:10px 10px 0 color-mix(in srgb,var(--a) 40%,transparent)}
#site[data-tpl=arcade] .hero::after{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(to top,rgba(11,6,22,calc(var(--sc)*.72)),transparent 60%)}
/* Silkscreen is a wide face with no descender room to spare, so it starts
   smaller and shrinks on the same curve. */
#site[data-tpl=arcade] .title-w{font-family:Silkscreen,monospace;font-weight:400;
  font-size:calc(clamp(20px, 4cqw, 42px) * var(--tz) * var(--tfit, 1));line-height:1.15}
/* Arcade keeps its hard offset shadow rather than the soft one — that sticker
   look is the skin — but it is driven by the same --bs slider, so the control
   still does something recognisable here instead of appearing broken. */
#site[data-tpl=arcade] .buy{font-family:Silkscreen,monospace;letter-spacing:0;
  border:3px solid #0B0616;
  box-shadow:calc(var(--bs) * 11px) calc(var(--bs) * 11px) 0 rgba(255,255,255,.9)}
#site[data-tpl=arcade] .buy:hover{transform:translate(3px,3px)}
#site[data-tpl=arcade] .strip{padding:0 clamp(18px,3vw,28px) 40px}
#site[data-tpl=arcade] .strip-in{border:3px solid var(--a);border-top:0;padding:22px 24px;
  background:color-mix(in srgb,var(--a) 12%,transparent)}
#site[data-tpl=arcade] .sf dt{font-family:Silkscreen,monospace;font-size:9px;letter-spacing:0;color:var(--a)}
#site[data-tpl=arcade] .sf dd{color:#EADCFF}
#site[data-tpl=arcade] .stores a{display:grid;place-items:center;width:44px;height:44px;
  border:2px solid color-mix(in srgb,var(--a) 60%,transparent);background:rgba(0,0,0,.35);transition:.12s}
/* The marks sit inside a bordered tile here, so the shared lift-on-hover would
   look like the icon escaping its box — invert the tile instead. currentColor
   flips with it, which is the whole benefit of the SVG set over the PNGs. */
#site[data-tpl=arcade] .stores a:hover{background:var(--a);color:#0B0616;transform:none}
#site[data-tpl=arcade] .stores a:hover img{filter:brightness(0)}
#site[data-tpl=arcade] .stores{--store-gap:10px}
#site[data-tpl=arcade] .stores img{height:22px}
#site[data-tpl=arcade] .stores .pi{width:24px;height:24px}
#site[data-tpl=arcade] .band{padding:0 clamp(18px,3vw,28px) clamp(42px,5vw,66px)}
#site[data-tpl=arcade] .band-in{max-width:var(--page);margin:0 auto}
#site[data-tpl=arcade] .h2{font-family:Silkscreen,monospace;font-size:13px;letter-spacing:0;color:var(--a);margin:0 0 16px}
#site[data-tpl=arcade] .lead .band-in{border:3px solid var(--a);padding:24px;background:rgba(0,0,0,.4);
  box-shadow:8px 8px 0 color-mix(in srgb,var(--a) 30%,transparent);max-width:var(--measure,900px)}
#site[data-tpl=arcade] .lead p{margin:0;font-size:clamp(16px,2vw,20px);line-height:1.6;color:#EADCFF}
#site[data-tpl=arcade] .video{border:3px solid var(--a);box-shadow:8px 8px 0 color-mix(in srgb,var(--a) 30%,transparent)}
#site[data-tpl=arcade] .shots{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@container page (max-width:640px){#site[data-tpl=arcade] .shots{grid-template-columns:1fr}}
#site[data-tpl=arcade] .shots > *{position:relative;aspect-ratio:16/9;overflow:hidden;
  border:3px solid color-mix(in srgb,var(--a) 55%,transparent)}
#site[data-tpl=arcade] .quote{border:3px solid color-mix(in srgb,var(--a) 55%,transparent);padding:18px;background:rgba(0,0,0,.3)}
#site[data-tpl=arcade] .quote cite{font-family:Silkscreen,monospace;color:var(--a);opacity:1;letter-spacing:0}
#site[data-tpl=arcade] .facts{border-top:3px solid var(--a);padding:38px clamp(18px,3vw,28px) 64px;background:rgba(0,0,0,.35)}
#site[data-tpl=arcade] .fact dt{font-family:Silkscreen,monospace;font-size:9px;letter-spacing:0;color:var(--a);opacity:1}
#site[data-tpl=arcade] .fact dd{color:#DCCFEE}
</style>
</head>
<body>

<main class="stage">
  <div class="viewport" id="viewport">
    <div class="frame">
      <div class="frame-bar">
        <div class="dots"><i></i><i></i><i></i></div>
        <div class="url">
          <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 118 0v3"/></svg>
          <span id="urlTxt"></span>
        </div>
        <!-- Preview/Edit lives in the window's own top-right corner, where a
             browser keeps its view controls, instead of at the far end of the
             editing pill. It is the one switch that is not an edit. -->
        <div class="frame-right"><button class="btn" id="view"></button></div>
      </div>
      <!-- The container panel. Docked under the chrome, spanning the page,
           because it is about the whole area beneath it. -->
      <div id="dock" class="glass"></div>
      <div class="frame-scroll" id="frameScroll">
        <div id="site" data-tpl="classic"></div>
      </div>
    </div>
    <div class="frame-note" id="frameNote"></div>
  </div>
</main>

<!-- One contextual toolbar, re-filled for whatever is selected. -->
<div id="tb" class="glass"></div>

<!-- Page-wide choices only. Everything else is edited on the page itself. -->
<div id="bar" class="glass"></div>

<div class="hint glass" id="hint"></div>

<!-- One file picker for every upload on the page; the target is set by whoever
     opened it. A second input would only be a second thing to keep in sync. -->
<input type="file" id="filePick" accept="image/*" hidden>

<div class="lightbox" id="lightbox" hidden><img alt=""><div class="lb-hint">Click anywhere, or press Esc, to close</div></div>

<!-- The prototype's own line-art platform marks (PROTO_PLATFORM_ICONS: ios,
     android, steam, epic). Loaded from the repo rather than copied in, so the
     mockup shows the real set and the ~18KB of Epic path data lives in one
     place. Served from the same root by `python3 -m http.server`. -->
<script src="platform-icons.js"></script>

<!-- THE ADAPTER. Loaded from the repo, not copied in, because it is the one
     file that will be shared with the real app: webPageData(state) reads a
     Shipmate submission and returns the shape this mockup's fixtures are
     written in. Having it here means the "Submission" entry in the game
     picker is not a fixture pretending to be real data — it is the actual
     mapping, running against a state object shaped exactly like Adam's. -->
<script src="web-page-data.js"></script>

<script>
/* ============================================================================
   GAME DATA
   `spilled` is REAL — Jaco's own delivery assets in test-assets/spilled, plus
   the facts and press quotes off Steam's appdetails API for appid 2240080. Same
   two sources the app already reads in _applySteamAboutData (app.js) and
   fetchSteamStorePage (claude.js). Nothing invented, which is the point: this
   is what Shipmate actually has the moment a Steam page is linked.
   ========================================================================== */
const LOCAL = 'test-assets/spilled';

/* Steam's own asset paths by appid — the same ones the app reads. Any title
   with a store page has these four at a fixed location, which is what makes
   "link your Steam page and the site builds itself" possible at all. */
const CDN_ = id => `https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${id}`;
const SS_  = (id, h) => `${CDN_(id)}/ss_${h}.1920x1080.jpg`;
/* Steam has TWO screenshot layouts and which one a title uses depends on when
   it was published: older pages keep them flat next to the appid, newer ones
   nest each shot in a folder named after its own hash. Both encoded, because a
   tool that reads store pages will meet both. */
const SSN_ = (id, h) => `${CDN_(id)}/${h}/ss_${h}.1920x1080.jpg`;

const GAMES = {
  spilled: {
    name:'Spilled!', slug:'spilled', real:true,
    title:'SPILLED!', tagline:'',
    accent:'#37A9C4', cta:'#FF4D8D', ctaLabel:'Buy now',
    // A real transparent logotype: pure-black glyphs on full alpha. Shown
    // exactly as delivered — the shadow slider is the only thing that touches
    // it, which is what keeps a developer's own artwork theirs.
    logo:`${LOCAL}/logo.png`,
    hero:`${LOCAL}/keyart.jpg`, header:`${LOCAL}/keyart.jpg`,
    portrait:`${LOCAL}/keyart_portrait.jpg`, icon:`${LOCAL}/icon.png`,
    // Bright art — light blue sky, green hills — so it needs far less scrim
    // than the dark art these skins were first tuned on.
    scrim:45,
    trailer:{ poster:'https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/257118708/68e82497e17f3e6929c4032a71a1bc4cc959f7a2/movie_600x337.jpg', label:'Release trailer' },
    shots:[ `${LOCAL}/shot1.jpg`,`${LOCAL}/shot2.jpg`,`${LOCAL}/shot3.jpg`,`${LOCAL}/shot4.jpg`,`${LOCAL}/shot5.jpg` ],
    studio:'Lente',
    line:'Clean the ocean. Take your time.',
    // FAKE, on purpose: Spilled! isn't on Epic. These are the four marks that
    // exist in PROTO_PLATFORM_ICONS, so the band can be judged with a full row.
    stores:['steam','ios','epic','android'],
    // Six fields, so the band is two clean rows of three. Contact is the one
    // value that is NOT from Steam — appdetails has no field for it — so it
    // ships as an obvious template placeholder rather than a plausible-looking
    // address invented for a real developer. Click it and type the real one.
    strip:[
      ['Developed by','Lente'], ['Published by','Lente'],
      ['Release date','26 March 2025'], ['Available on','stores'],
      ['Genres','Adventure, Casual, Indie, Simulation'],
      ['Contact','press@yourstudio.com'],
    ],
    long:'Spilled! is a short game in which there are no wrong ways to play. You can finish it in about an hour — unwind and take as long as you want. Clean up, recycle, earn coins and upgrade your boat to tackle the next area. Move through eight areas, each bigger than the last, with bigger oil spills and different kinds of waste. Find and save 16 different animals throughout the game.',
    // Three or four lines at the lead's measure: enough to actually sell the
    // game, still short enough that nobody has to read the store bible above.
    minis:[
      'A small red tugboat, a sea slick with oil, and about an hour with nothing more urgent to do than clean it up. Skim the spills, push the plastic over to the recycling barge, and spend what you earn making the boat better at it. Eight bays, each messier than the last, and sixteen animals somewhere in the sludge waiting to be pulled out.',
      'You have a boat, and the ocean has a problem. Clear the oil one slow pass at a time, recycle whatever you haul in, and upgrade the hull until the next bay stops being a wall. There is no clock and no way to fail — the water just gets bluer behind you, and sixteen animals get to go home.',
      'Spilled! is an hour of quiet, useful work. Push oil into the skimmer, drag bottles to the recycling plant, put out the fires, and watch a brown bay turn back to blue in your wake. Then buy a better boat and go do it again somewhere worse.',
    ],
    // Pull-quotes as published by the developer on their own Steam page.
    quotes:[
      ['A therapeutic, easy-to-play, and adorable cleaning simulator that hits all the right notes.','VICE'],
      ['There’s something viscerally compelling about watching the game’s muddy brown waters gradually brighten to a clear blue.','Polygon'],
      ['A solid and gentle indie game that lets me clean up the world for an hour.','Kotaku'],
    ],
    facts:[
      ['Developer','Lente'], ['Publisher','Self-published'], ['Release date','26 March 2025'],
      ['Genres','Adventure, Casual, Indie, Simulation'], ['Platforms','PC, Mac, Switch, iOS, Android'],
      ['Price','$5.99 USD'], ['Languages','23, all with full audio'], ['Features','Achievements, full controller support'],
    ],
  },

  /* Jaco's own game, and the most useful test in the set for two reasons.

     One: everything here came off the live Steam page — name, studios, date,
     genres, price, languages, the seven screenshots, the trailer poster. It is
     the actual "link your Steam page and the site builds itself" path, not a
     hand-written fixture.

     Two: its library assets are not in any API response, so it arrives with
     the store BACKGROUND as its hero and no logotype at all — and then
     upgradeSteamArt goes looking for the real library_hero.jpg, logo.png and
     library_600x900.jpg in the browser, where an image either decodes or does
     not. Whatever it finds replaces this. What is written here is the floor,
     not the ceiling.

     Which also makes it the honest test of the bare template: for the second
     or so before that returns — and forever, if the assets are not published —

/* ── THE LIBRARY ASSETS, WHICH NO API WILL HAND OVER ──────────────────────
   appdetails gives `background_raw` — the store page's BACKGROUND. It is not
   the key art: Steam derives it, dims it, and spreads it behind the page, so
   using it as a hero means shipping a washed-out version of art the developer
   made properly. The real files are the library set:

     library_hero.jpg    3840×1240   the wide banner — this is the key art
     logo.png                        the transparent title logotype
     library_600x900.jpg             the portrait capsule

   No endpoint returns their URLs. Newer store pages keep every asset in a
   per-asset hash folder that appdetails does not expose, and IStoreBrowseService
   would not answer from here. But the URLs are guessable — there are only two
   layouts Valve has ever used — and an image either loads or it doesn't. So
   rather than reason about which layout a title uses, ASK THE BROWSER: try each
   candidate, keep the first that decodes. A miss is a 404, which costs one
   request and nothing else.

   This is the one job the browser can do that the server-side importer cannot,
   and it is why the page upgrades itself a moment after it appears rather than
   waiting: the text is right immediately, the art gets better when it arrives. */
const STEAM_LEGACY = id => `https://cdn.akamai.steamstatic.com/steam/apps/${id}`;
const ASSET_CANDIDATES = (id, file) => [`${CDN_(id)}/${file}`, `${STEAM_LEGACY(id)}/${file}`];

/* Resolves to the first URL that actually decodes, or null. Deliberately not
   fetch(): an <img> is not blocked by CORS for mere display, and decoding is
   the only real proof the file is there and is an image. */
function firstImage(urls, ms = 6000){
  return new Promise(resolve => {
    let i = 0, done = false;
    const finish = v => { if(!done){ done = true; resolve(v); } };
    const timer = setTimeout(() => finish(null), ms);
    (function next(){
      if(i >= urls.length) return finish(null);
      const url = urls[i++];
      const img = new Image();
      img.onload  = () => { if(img.naturalWidth){ clearTimeout(timer); finish(url); } else next(); };
      img.onerror = next;
      img.src = url;
    })();
  });
}

/* Look for the three library assets and keep whatever is really there. Runs
   after the page is already on screen, and re-renders only if it found
   something — a title with no library assets simply never changes. */
async function upgradeSteamArt(id){
  const g = GAMES[id];
  if(!g || !g.appid) return;
  const [hero, logo, portrait] = await Promise.all([
    firstImage(ASSET_CANDIDATES(g.appid, 'library_hero.jpg')),
    firstImage(ASSET_CANDIDATES(g.appid, 'logo.png')),
    firstImage(ASSET_CANDIDATES(g.appid, 'library_600x900.jpg')),
  ]);
  /* Only what is actually NEW. A title whose entry already points at the real
     library assets finds the same URLs again, and must neither re-render nor
     announce a discovery it did not make. The store background stays wherever
     no library hero was found, so a page never ends up with an empty box. */
  const found = [];
  if(hero     && hero     !== g.hero)     { g.hero = hero;         found.push('key art'); }
  if(logo     && logo     !== g.logo)     { g.logo = logo;         found.push('logotype'); }
  if(portrait && portrait !== g.portrait) { g.portrait = portrait; found.push('cover'); }
  if(!found.length || M.game !== id) return;
  // render() is what measures a logotype's ink, so a newly-found one is placed
  // by its letters exactly like one that shipped with the game.
  render();
  hint('Found the ' + found.join(', ') + " in Steam's library assets");
}
