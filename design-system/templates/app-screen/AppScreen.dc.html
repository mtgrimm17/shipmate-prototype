<!DOCTYPE html>

<span style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;border:1px solid #2a2a2a;background:#141414;color:#a0a0a0;font-size:13px;cursor:pointer"><x-import component-from-global-scope="ShipmateDesignSystem_f314df.PlatformIcon" platform="nintendo" size="{{ 18 }}" hint-size="18px,18px"></x-import>Nintendo eShop<span style="color:#555">+</span></span>
