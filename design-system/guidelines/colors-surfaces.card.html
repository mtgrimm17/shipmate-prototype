<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-mono);font-size:var(--fs-body);line-height:var(--lh-snug)}.p{padding:18px 20px}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:88px}.chip{height:56px;border-radius:var(--r-lg);border:var(--border-line)}.n{font-size:10px;color:var(--text-dim);margin-top:6px;letter-spacing:.02em}.v{font-size:10px;color:var(--text-faint);margin-top:2px}a{color:var(--green-brand)}a:hover{color:#fff}</style></head><body><div class="p"><div class="g"><div class="sw"><div class="chip" style="background:#0a0a0a;"></div><div class="n">--bg</div><div class="v">#0a0a0a</div></div><div class="sw"><div class="chip" style="background:#000000;"></div><div class="n">--bg-marketing</div><div class="v">#000000</div></div><div class="sw"><div class="chip" style="background:#141414;"></div><div class="n">--panel</div><div class="v">#141414</div></div><div class="sw"><div class="chip" style="background:#1c1c1c;"></div><div class="n">--panel-2</div><div class="v">#1c1c1c</div></div><div class="sw"><div class="chip" style="background:#242424;"></div><div class="n">--panel-3</div><div class="v">#242424</div></div><div class="sw"><div class="chip" style="background:#2a2a2a;"></div><div class="n">--border</div><div class="v">#2a2a2a</div></div><div class="sw"><div class="chip" style="background:#3a3a3a;"></div><div class="n">--border-hover</div><div class="v">#3a3a3a</div></div></div></div></body></html>
