<!-- @dsCard group="Elevation" viewport="700x170" name="Glows & rings" subtitle="Emphasis is a glow, not a drop shadow" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-mono);font-size:var(--fs-body);line-height:var(--lh-snug)}.p{padding:18px 20px}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:88px}.chip{height:56px;border-radius:var(--r-lg);border:var(--border-line)}.n{font-size:10px;color:var(--text-dim);margin-top:6px;letter-spacing:.02em}.v{font-size:10px;color:var(--text-faint);margin-top:2px}a{color:var(--green-brand)}a:hover{color:#fff}</style></head><body><div class="p"><div class="g" style="gap:16px;padding-bottom:14px">
<div class="sw"><div style="height:52px;background:var(--green-brand);border:var(--border-line);border-radius:var(--r-xl);box-shadow:0 0 30px 4px rgba(47,220,128,.22)"></div><div class="n">--glow-cta</div></div><div class="sw"><div style="height:52px;background:rgba(74,222,128,.15);border:var(--border-line);border-radius:var(--r-xl);box-shadow:0 0 10px rgba(74,222,128,.2)"></div><div class="n">--glow-submit</div></div><div class="sw"><div style="height:52px;background:var(--sel-bg);border:var(--border-line);border-radius:var(--r-xl);box-shadow:0 0 0 2px rgba(96,165,250,.12)"></div><div class="n">--ring-selected</div></div><div class="sw"><div style="height:52px;background:rgba(251,146,60,.05);border:var(--border-line);border-radius:var(--r-xl);box-shadow:0 0 0 2px rgba(251,146,60,.12)"></div><div class="n">--ring-required</div></div><div class="sw"><div style="height:52px;background:var(--panel);border:var(--border-line);border-radius:var(--r-xl);box-shadow:0 0 0 1px rgba(47,220,128,.12)"></div><div class="n">--ring-ready</div></div>
</div></div></body></html>
