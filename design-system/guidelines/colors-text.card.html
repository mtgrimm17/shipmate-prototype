<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-mono);font-size:var(--fs-body);line-height:var(--lh-snug)}.p{padding:18px 20px}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:88px}.chip{height:56px;border-radius:var(--r-lg);border:var(--border-line)}.n{font-size:10px;color:var(--text-dim);margin-top:6px;letter-spacing:.02em}.v{font-size:10px;color:var(--text-faint);margin-top:2px}a{color:var(--green-brand)}a:hover{color:#fff}</style></head><body><div class="p"><div class="g">
<div class="sw"><div class="chip" style="background:var(--panel);display:flex;align-items:center;justify-content:center;color:#f5f5f5;font-size:15px">Aa</div><div class="n">--text</div><div class="v">#f5f5f5</div></div>
<div class="sw"><div class="chip" style="background:var(--panel);display:flex;align-items:center;justify-content:center;color:#a0a0a0;font-size:15px">Aa</div><div class="n">--text-dim</div><div class="v">#a0a0a0</div></div>
<div class="sw"><div class="chip" style="background:var(--panel);display:flex;align-items:center;justify-content:center;color:#555;font-size:15px">Aa</div><div class="n">--text-faint</div><div class="v">#555555</div></div>
<div class="sw"><div class="chip" style="background:var(--green-brand);display:flex;align-items:center;justify-content:center;color:#05130a;font-size:15px;font-weight:600">Aa</div><div class="n">--text-on-green</div><div class="v">#05130a</div></div>
</div></div></body></html>
