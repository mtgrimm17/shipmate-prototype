<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-mono);font-size:var(--fs-body);line-height:var(--lh-snug)}.p{padding:18px 20px}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:88px}.chip{height:56px;border-radius:var(--r-lg);border:var(--border-line)}.n{font-size:10px;color:var(--text-dim);margin-top:6px;letter-spacing:.02em}.v{font-size:10px;color:var(--text-faint);margin-top:2px}a{color:var(--green-brand)}a:hover{color:#fff}</style></head><body><div class="p"><div style="display:flex;align-items:center;gap:40px"><img src="../assets/logos/shipmate-logo.png" alt="Shipmate" style="height:74px;width:auto"><div style="font-size:11px;line-height:1.8;color:var(--text-faint);max-width:300px">The lockup carries its own black lozenge — place it only on <code style="color:var(--text-dim)">--bg</code> or pure black. 40px tall in the app topbar, 52px on the splash. Where it will not fit, set <b style="color:var(--text)">Shipmate</b> in Inter 700, 15px, 0.04em, uppercase.</div></div></div></body></html>
