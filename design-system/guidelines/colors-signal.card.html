<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-mono);font-size:var(--fs-body);line-height:var(--lh-snug)}.p{padding:18px 20px}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:88px}.chip{height:56px;border-radius:var(--r-lg);border:var(--border-line)}.n{font-size:10px;color:var(--text-dim);margin-top:6px;letter-spacing:.02em}.v{font-size:10px;color:var(--text-faint);margin-top:2px}a{color:var(--green-brand)}a:hover{color:#fff}</style></head><body><div class="p"><div class="g"><div class="sw"><div class="chip" style="background:#4ade80;"></div><div class="n">--green</div><div class="v">#4ade80</div></div><div class="sw"><div class="chip" style="background:#fb923c;"></div><div class="n">--orange</div><div class="v">#fb923c</div></div><div class="sw"><div class="chip" style="background:#FF3B76;"></div><div class="n">--magenta</div><div class="v">#FF3B76</div></div><div class="sw"><div class="chip" style="background:#60a5fa;"></div><div class="n">--blue</div><div class="v">#60a5fa</div></div><div class="sw"><div class="chip" style="background:#fbbf24;"></div><div class="n">--amber</div><div class="v">#fbbf24</div></div><div class="sw"><div class="chip" style="background:rgba(255,200,80,0.85);"></div><div class="n">--processing</div><div class="v">rgba(255,200,80,0.85)</div></div></div></div></body></html>
