<!-- @dsCard group="Colors" viewport="700x150" name="Impact bars" subtitle="Action-card headers — the only large blocks of pure colour" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-mono);font-size:13px}.p{padding:18px 20px;display:flex;flex-direction:column;gap:8px}.bar{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-radius:6px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}a{color:var(--link)}a:hover{color:var(--link-hover)}</style></head>
<body><div class="p">
<div class="bar" style="background:var(--impact-high);color:var(--impact-high-ink)"><span>Rejection</span><span style="font-weight:500;text-transform:none">--impact-high · #EB3B3B</span></div>
<div class="bar" style="background:var(--impact-medium);color:var(--impact-medium-ink)"><span>Costs reach</span><span style="font-weight:500;text-transform:none">--impact-medium · #D05017</span></div>
<div class="bar" style="background:var(--impact-notice);color:var(--impact-notice-ink)"><span>Optional</span><span style="font-weight:500;text-transform:none">--impact-notice · #ECBE49</span></div>
<div class="bar" style="background:var(--impact-done);color:var(--impact-done-ink)"><span>Resolved</span><span style="font-weight:500;text-transform:none">--impact-done · #92FE85</span></div>
</div></body></html>
