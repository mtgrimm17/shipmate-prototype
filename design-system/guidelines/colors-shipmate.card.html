<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-mono);font-size:13px}.p{padding:18px 20px;display:flex;gap:10px}.sw{flex:1}.chip{height:56px;border-radius:8px;border:1px solid var(--border)}.n{font-size:10px;color:var(--text-dim);margin-top:6px}.v{font-size:10px;color:var(--text-faint);margin-top:2px}a{color:var(--link)}a:hover{color:var(--link-hover)}</style></head>
<body><div class="p">
<div class="sw"><div class="chip" style="background:#9F68F0"></div><div class="n">--shipmate</div><div class="v">#9F68F0</div></div>
<div class="sw"><div class="chip" style="background:#8359FF"></div><div class="n">--shipmate-bright</div><div class="v">#8359FF</div></div>
<div class="sw"><div class="chip" style="background:#A072D4"></div><div class="n">--shipmate-glyph</div><div class="v">#A072D4 · the ✦</div></div>
<div class="sw" style="flex:1.4"><div class="chip" style="background:var(--shipmate-wash),var(--panel);border-color:var(--shipmate-border)"></div><div class="n">--shipmate-wash</div><div class="v">tip / pre-answer banner</div></div>
<div class="sw"><div class="chip" style="background:var(--suggest-bg);border-color:var(--suggest-border)"></div><div class="n">--suggest-bg</div><div class="v">#7A56AE border</div></div>
</div></body></html>
