<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Forms</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-mono);font-size:var(--fs-body);line-height:var(--lh-snug)}#root{padding:20px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.lbl{font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;letter-spacing:var(--ls-section);color:var(--text-faint)}a{color:var(--green-brand)}a:hover{color:#fff}</style></head><body><div id="root"></div>
<script type="text/babel">
const { FormLabel, Input, Dropzone, TooltipIcon } = window.ShipmateDesignSystem_f314df;
function Demo(){
  return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
    <div className="col" style={{gap:14}}>
      <div><FormLabel required>Game Title</FormLabel><Input defaultValue="Go Ape Ship!"/></div>
      <div><FormLabel hint="Optional">Trailer URL <TooltipIcon title="YouTube links only."/></FormLabel><Input placeholder="https://youtube.com/watch?v=…"/></div>
      <div><FormLabel required>Age Ratings <TooltipIcon warned glyph="!" title="Brazil requires a local rating."/></FormLabel><Input required placeholder="Not answered yet"/></div>
      <div><FormLabel>Release Track</FormLabel><Input as="select" defaultValue="tf"><option value="tf">TestFlight — External</option><option>App Store</option></Input></div>
    </div>
    <div className="col" style={{gap:14}}>
      <div><FormLabel required>Description</FormLabel><Input as="textarea" placeholder="Tell players what makes your game worth their time…" style={{minHeight:96}}/></div>
      <Dropzone label="Drop screenshots" hint="PNG or JPG · at least 3 per device size"/>
      <Dropzone compact required label="Upload build" hint=".ipa, .aab or Steam depot"/>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
