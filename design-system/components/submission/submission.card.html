<script type="text/babel">
const { ActionCard, ActionCardSection, SuggestionCompare, InsightPanel, InsightSection, FixItButton, PartnerCard, NoticeBanner, CodeBlock } = window.ShipmateDesignSystem_f314df;
const XML = "<key>NSPrivacyAccessedAPITypes</key>\n<array>\n  <dict>\n    <key>NSPrivacyAccessedAPIType</key>\n    <string>NSPrivacyAccessedAPICategoryUserDefaults</string>\n    <key>NSPrivacyAccessedAPITypeReasons</key>\n    <array><string>CA92.1</string></array>\n  </dict>\n</array>";
function Demo(){

      <ActionCard title="Privacy manifest missing entries" impact="high" page={1} pages={3}>
        <ActionCardSection>PrivacyInfo.xcprivacy lacks required NSPrivacyAccessedAPITypes entries for UserDefaults (CA92.1) and FileTimestamp (3C8A.1) access. Builds without complete privacy manifests are rejected by App Store Connect.</ActionCardSection>
        <CodeBlock label="Add to PrivacyInfo.xcprivacy" code={XML} maxHeight={120}/>
      </ActionCard>
      <ActionCard title="Localize into English" impact="medium" page={1} pages={2}>
        <ActionCardSection label="Game localization">~100M potential players in your selected markets speak English as their primary language. Games localized into the local language see 30–50% more revenue on average vs. English-only releases.</ActionCardSection>
        <SuggestionCompare current="Don't add English Language Localization" suggestion="Add English Language Localization" caveat="This will require a new build"/>
      </ActionCard>
      <ActionCard title="Store page" impact="medium" resolved page={1} pages={5}>
        <ActionCardSection label="Subtitle">Adding a subtitle that highlights the signature Portal Gun mechanic will immediately signal game identity in search results.</ActionCardSection>

      <NoticeBanner onDismiss={()=>{}}>Do you already have a marketing plan? or press strategy? Contact these fine partners top of their class and reach even more</NoticeBanner>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        <PartnerCard name="Partner Name" description="Partner short description bla bla blablabla, bla bla blabla bla, maximum three lines of text"/>
        <PartnerCard name="Partner Name" description="Partner short description bla bla blablabla, bla bla blabla bla, maximum three lines of text"/>
      </div>
    </div>
    <InsightPanel>
      <InsightSection label="Category Name">Description of what is expected from the user and the impact on the submission</InsightSection>
      <InsightSection label="Category Technical Info">Brief summary of technical info and link to full documentation.<br/><a href="#">Documentation Website ↗</a></InsightSection>
      <InsightSection label="Shipmate Insight" shipmate>Brief description of Intelligence recommended action for better results + magic fix button</InsightSection>
      <FixItButton/>
    </InsightPanel>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
